<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite NDVI Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
     crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
     crossorigin=""></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        .legend {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Initialize map centered on San Francisco (Default AOI)
        var map = L.map('map').setView([37.76, -122.43], 12);

        // Add OpenStreetMap base layer
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Add our Local NDVI Tile Layer
        // Ensure kubectl port-forward is running on port 8000
        L.tileLayer('http://localhost:8000/ndvi/tiles/{z}/{x}/{y}.png', {
            minZoom: 10,
            maxZoom: 16,
            tms: false, // Standard XYZ
            opacity: 0.7,
            attribution: 'NDVI Processing Pipeline'
        }).addTo(map);

        // Add Legend
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML += "<h4>NDVI Index</h4>";
            div.innerHTML += '<i style="background: #006400"></i> High Vegetation<br>';
            div.innerHTML += '<i style="background: #90EE90"></i> Low Vegetation<br>';
            div.innerHTML += '<i style="background: #FFFF00"></i> No Vegetation<br>';
            div.innerHTML += '<i style="background: #0000FF"></i> Water/Cloud<br>';
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
