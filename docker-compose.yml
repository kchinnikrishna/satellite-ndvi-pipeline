services:
  db:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ndvi_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - ndvi-net

  ingestion:
    build:
      context: .
      dockerfile: ./data_ingestion/Dockerfile
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./data_ingestion:/app
    networks:
      - ndvi-net

  processing:
    build:
      context: .
      dockerfile: ./ndvi_processing/Dockerfile
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./ndvi_processing:/app
    networks:
      - ndvi-net

  api:
    build:
      context: .
      dockerfile: ./api_gateway/Dockerfile
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - db
    image: satellite-ndvi-api
    volumes:
      - ./api_gateway:/app
    networks:
      - ndvi-net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  ndvi-net:
    driver: bridge
