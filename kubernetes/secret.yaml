apiVersion: v1
kind: Secret
metadata:
  name: ndvi-secrets
  namespace: satellite-ndvi
type: Opaque
data:
  # Values must be base64 encoded
  # postgres => cG9zdGdyZXM=
  POSTGRES_USER: cG9zdGdyZXM= 
  POSTGRES_PASSWORD: cG9zdGdyZXM=
  
  # Placeholders
  SENTINEL_HUB_CLIENT_ID: base64_client_id_here
  SENTINEL_HUB_CLIENT_SECRET: base64_client_secret_here
